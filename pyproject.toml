[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printguard"
version = "0.3.0.dev0"
description = "Scheduled reports that print, confirm the job left the queue, and alert you when they don't."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["reportlab>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
printguard = "printguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
